name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; defaults to v<version> from tauri.conf.json)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Verify signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing repository secret TAURI_SIGNING_PRIVATE_KEY. Configure it in Settings -> Secrets and variables -> Actions."
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $pkgVer = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version
          $tauriVer = (Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $cargoRaw = Get-Content -Raw 'src-tauri/Cargo.toml'
          if ($cargoRaw -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not read version from src-tauri/Cargo.toml"
          }
          $cargoVer = $Matches[1]

          if ($env:EVENT_NAME -eq 'push') {
            $tag = $env:REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG.Trim()
          } else {
            $tag = "v$tauriVer"
          }

          $tagVer = $tag.TrimStart('v')
          Write-Host "Tag: $tag | package.json: $pkgVer | Cargo.toml: $cargoVer | tauri.conf.json: $tauriVer"

          if ($pkgVer -ne $tagVer -or $cargoVer -ne $tagVer -or $tauriVer -ne $tagVer) {
            throw "Version mismatch: tag=$tagVer, package.json=$pkgVer, Cargo.toml=$cargoVer, tauri.conf.json=$tauriVer. Run ./scripts/bump-version.ps1 first."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$tagVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate release notes
        id: notes
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $body = ''
          if ($env:EVENT_NAME -eq 'push') {
            $tagType = (git cat-file -t $env:TAG 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -eq 0 -and $tagType -eq 'tag') {
              $tagMsg = (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim()
              if ($tagMsg -and $tagMsg -ne $env:TAG) {
                $body = $tagMsg
              }
            }
          }

          if (-not $body) {
            $prevTag = $null
            $prevRef = if ($env:EVENT_NAME -eq 'push') { "$($env:TAG)^" } else { 'HEAD^' }
            $desc = (git describe --tags --abbrev=0 --match 'v*' $prevRef 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -eq 0 -and $desc) {
              $prevTag = $desc
            }

            if ($prevTag) {
              $log = (git log "$prevTag..HEAD" --no-merges --pretty=format:'- %s' | Out-String).Trim()
              if ($log) { $body = $log }
            } else {
              $log = (git log -n 20 --no-merges --pretty=format:'- %s' | Out-String).Trim()
              if ($log) { $body = $log }
            }
          }

          if (-not $body) {
            $body = "LLM Translate $($env:TAG)"
          }

          Write-Host "Release notes:`n$body"
          "body<<__LLMT_NOTES_EOF__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "__LLMT_NOTES_EOF__" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cache ONNX Runtime prebuilt binaries
        uses: actions/cache@v4
        with:
          path: src-tauri/target/ort-cache
          key: ort-cache-win-x64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache llama.cpp binaries
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/llama
          key: llama-win-x64-${{ hashFiles('scripts/fetch-llama.ps1') }}

      - name: Cache PP-OCRv6 models
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/ocr
          key: ocr-ppocrv6-${{ hashFiles('scripts/fetch-ocr.ps1') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch llama.cpp and OCR resources
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/resources/llama/llama-server.exe')) {
            ./scripts/fetch-llama.ps1
          } else {
            Write-Host 'Using cached llama.cpp binaries'
          }
          ./scripts/fetch-ocr.ps1

      - name: Populate ort-cache and stage runtime DLLs
        shell: pwsh
        run: |
          $dml = Get-ChildItem -Path 'src-tauri/target/ort-cache' -Recurse -Filter 'DirectML.dll' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          if (-not $dml) {
            Push-Location 'src-tauri'
            try {
              # Trigger ort-sys build script with workspace features (uses src-tauri/.cargo/config.toml)
              # without running llm-translate's tauri-build before runtime DLLs are staged.
              cargo check --release --locked -p oar-ocr
              if ($LASTEXITCODE -ne 0) { throw "cargo check -p oar-ocr failed" }
            } finally {
              Pop-Location
            }
          }
          ./scripts/prepare-runtime.ps1

      - name: Build, sign and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: LLM Translate ${{ steps.meta.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
