[package]
name = "llm-translate"
version = "0.1.0"
description = "Local LLM translator"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "llm_translate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-version = "0.1"
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
hex = "0.4.3"
tokio-util = "0.7.20"
lru = "0.19.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
anyhow = "1.0.104"
dirs = "7.0.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json", "http2", "native-tls"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# PP-OCRv6 via ONNX Runtime (statically linked prebuilt; imports DirectML.dll).
oar-ocr = "0.11"
image = { version = "0.25", default-features = false }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
windows-registry = "0.6.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Hashing multi-GB model files is ~30x slower unoptimized.
[profile.dev.package.sha2]
opt-level = 3
